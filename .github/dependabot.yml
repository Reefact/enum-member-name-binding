version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Matches the commit convention this repository already follows, so a routine dependency bump
    # reads like every other commit and passes the same lint.
    commit-message:
      prefix: "build"
    ignore:
      # The version of Microsoft.CodeAnalysis.* the analyzer compiles against sets the minimum
      # Roslyn a host must carry to load it: raise it, and the shipped analyzer stops loading on
      # older SDKs and IDEs. That is a decision about who the package still supports, not routine
      # maintenance, so it should arrive as a deliberate change rather than as a weekly pull
      # request nobody asked for. A single nuget entry cannot be scoped to one project, so the
      # freeze also covers the analyzer test project, which pins the same version on purpose.
      #
      # Microsoft.CodeAnalysis.Analyzers is on the list for a reason worth writing down: ignoring a
      # dependency stops Dependabot proposing an update TO it, not an update that DRAGS it along.
      # Left off, it was bumped as part of a group and carried Microsoft.CodeAnalysis.CSharp with
      # it — exactly the pull request the two entries below exist to prevent. Freezing the peer is
      # what makes the freeze hold.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      - dependency-name: "Microsoft.CodeAnalysis.Common"
      - dependency-name: "Microsoft.CodeAnalysis.Analyzers"

      # Microsoft.OpenApi's major line belongs to ASP.NET Core, not to this repository.
      # Microsoft.AspNetCore.OpenApi 10.0.x is compiled against the 2.x API and ships a source
      # generator that writes into this project; under 3.x that generated code stops compiling —
      # IOpenApiMediaType.Example became read-only — so the bump breaks the build inside a file
      # nobody here wrote, and nothing on this side can fix it. No metadata records the limit: the
      # nuspec declares a 2.0.0 floor and no ceiling, so neither NuGet nor Dependabot can see the
      # incompatibility, and it surfaces only at compile time. That is precisely why the ceiling
      # has to be stated here.
      #
      # Only the major is frozen, and that restraint is the point: the explicit 2.11.0 reference
      # exists to stay clear of GHSA-v5pm-xwqc-g5wc, so 2.x updates must keep arriving. ASP.NET
      # Core 11 already depends on Microsoft.OpenApi 3.x, which makes this entry the thing to
      # delete the day this repository targets net11.0 — not a position to defend.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    # This is what makes SHA pinning sustainable. Pinned by digest, an action never moves on its
    # own; without something proposing the bumps, "never moves" quietly becomes "never updated".
    groups:
      # codeql-action ships init and analyze as separate actions that MUST run the same version:
      # analyze refuses a database built by a different one. Bumping either alone leaves codeql.yml
      # mismatched and red, so they move together or not at all.
      codeql-action:
        patterns:
          - "github/codeql-action*"
