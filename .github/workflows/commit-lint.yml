name: commit-lint

# Hold a pull request to the two rules about its commits: each message follows the convention, and
# the branch carries no merge commit.
#
# The messages are checked with the same script the local hook runs. The hook is the fast feedback;
# this is the guarantee. `git commit --no-verify` bypasses the hook silently, and a contributor who
# never ran `git config core.hooksPath .githooks` has no hook at all — so without this the
# convention would hold only for people who opted into it.
#
# The merge commit has no hook to bypass. It was the one rule in CONTRIBUTING.md that nothing
# checked, and an unchecked rule is discovered late: GitHub refuses to rebase the pull request, at
# the merge button, after review.

on:
  pull_request:
    branches:
      - main

concurrency:
  group: commit-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-lint:
    name: Conventional commits
    runs-on: ubuntu-latest
    # Reading a handful of messages is seconds; the cap bounds a stuck runner.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The pull request's own commits are needed, so a shallow tip will not do.
          fetch-depth: 0

      - name: Lint the commits this pull request adds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # `main` moves only by rebase or squash, so its history stays linear — see CONTRIBUTING.md.
          # Checked over the range rather than inside lint-commit-message.sh, and that is the whole
          # distinction: that script reads one message and exempts a merge's, correctly, because git
          # wrote it and no convention can hold a generated sentence. Whether a merge commit belongs
          # on the branch at all is a property of the set, which only this workflow knows.
          merge_status=0
          merges="$(git rev-list --merges "${BASE_SHA}..${HEAD_SHA}")"
          if [ -n "${merges}" ]; then
            echo "This pull request carries a merge commit, which main does not take:"
            for sha in ${merges}; do
              echo "── $(git log -1 --format='%h %s' "${sha}")"
            done
            echo "   Rebase onto main rather than merging it in:"
            echo "     git fetch origin main && git rebase origin/main"
            echo
            merge_status=1
          else
            # Says so even when there is nothing to say, and that is the point: a check silent on
            # the clean path cannot be told apart in the log from a check that never ran.
            echo "No merge commit in the range."
          fi

          echo "Linting non-merge commits in ${BASE_SHA}..${HEAD_SHA}"
          commits="$(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")"
          if [ -z "${commits}" ]; then
            # Not an early exit any more. A pull request whose every commit is a merge has nothing
            # to lint and is still refused above, so the answer has to come from both checks.
            echo "No non-merge commits to lint."
            exit "${merge_status}"
          fi

          status=0
          for sha in ${commits}; do
            echo "── $(git log -1 --format='%h %s' "${sha}")"

            # Dependabot writes its own mechanical headers and cannot amend them; their length is
            # driven by the package name, so a long one overruns the limit on its own. They come
            # from a trusted bot rather than a contributor, so they are exempt here instead of
            # failing routine dependency pull requests. The author is what identifies them, and a
            # human commit never carries it — so if one of those messages is ever rewritten by
            # hand, the author changes and the rewrite is linted normally.
            author_email="$(git log -1 --format='%ae' "${sha}")"
            case "$author_email" in
              *dependabot*)
                echo "   skipped (Dependabot-authored)"
                continue
                ;;
            esac

            if git log -1 --format=%B "${sha}" | tools/commit-lint/lint-commit-message.sh --ci -; then
              echo "   ok"
            else
              status=1
            fi
          done

          if [ "${status}" -ne 0 ]; then
            echo
            echo "One or more commit messages do not follow the convention."
            echo "Fix them with an interactive rebase (git rebase -i) before merge."
          fi

          # Both answers, never one: a branch can carry a merge commit and a malformed message at
          # once, and reporting only the first would cost a second round trip to find the second.
          if [ "${merge_status}" -ne 0 ]; then
            status=1
          fi
          exit "${status}"
