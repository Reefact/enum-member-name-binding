name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A run that never gets a runner cannot be cancelled or re-run through the API — GitHub answers
  # "cannot cancel a workflow re-run that has not yet queued" and "this workflow is already running".
  # Without a manual trigger the only way out is an empty commit, so there is one.
  workflow_dispatch:

# Supersede a run the moment a newer commit arrives on the same branch or pull request. Three
# pushes in a row otherwise hold six runners to answer a question only the last one asks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (SDK ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    # The whole job runs in about a minute; the cap only bounds a hung one, which would otherwise
    # hold its runner for the six-hour default.
    timeout-minutes: 20
    permissions:
      contents: read

    # The matrix is over SDK versions rather than operating systems, deliberately. This library has
    # no platform-specific code — no paths, no culture-sensitive comparisons — so Windows would add
    # cost and catch nothing. What has actually broken this build, twice, is an analyzer difference
    # between the SDK declared in global.json and the newest one, so that is what is guarded here.
    strategy:
      fail-fast: false
      matrix:
        sdk: ['10.0.100', '10.0.x']

    env:
      CI: true
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts

      # The previous generation of this library shipped for years without its ASP.NET Core
      # framework reference, because the package was assembled by a hand-written .nuspec.
      # This check makes that class of mistake impossible to merge.
      - name: Verify the package declares its ASP.NET Core framework reference
        run: |
          set -euo pipefail
          package=$(ls artifacts/AspNetCore.EnumMemberNameBinding.[0-9]*.nupkg)
          unzip -p "$package" 'AspNetCore.EnumMemberNameBinding.nuspec' > /tmp/packed.nuspec
          echo "--- packed nuspec ---"
          cat /tmp/packed.nuspec
          grep -q 'frameworkReference name="Microsoft.AspNetCore.App"' /tmp/packed.nuspec \
            || { echo "::error::the package does not declare Microsoft.AspNetCore.App"; exit 1; }
          unzip -l "$package" | grep -q 'analyzers/dotnet/cs/AspNetCore.EnumMemberNameBinding.Analyzers.dll' \
            || { echo "::error::the package does not ship the analyzers"; exit 1; }

      # Everything above reaches the library through a ProjectReference, which never exercises the
      # package: not the framework reference, not the analyzers' place inside it, not the MSBuild
      # assets, and not whether a consumer with their own defaults can compile against any of it.
      # This starts from a fresh pack and ends at an HTTP response. It runs on both SDKs, because an
      # analyzer behaving differently between them is the reason this matrix exists.
      - name: Package smoke test
        timeout-minutes: 10
        run: tests/PackageSmokeTest/run.sh

      - uses: actions/upload-artifact@v4
        with:
          name: packages-sdk-${{ matrix.sdk }}
          path: artifacts/*

  # The one check `main` requires, and the only reason this job exists.
  #
  # The matrix above reports under names that carry the SDK it ran on — "build (SDK 10.0.100)" and
  # "build (SDK 10.0.x)". Requiring those by name works exactly until the matrix changes: the
  # required name then belongs to a job nobody runs, so it never reports, and every pull request
  # sits at "Expected — waiting for status" with no way forward but an admin bypass. Requiring this
  # job instead leaves the matrix free to grow an SDK or an operating system without anyone
  # remembering to go and edit a branch rule.
  #
  # `if: always()` is load-bearing. Without it this job is skipped whenever the matrix fails or is
  # cancelled, and GitHub counts a skipped required check as satisfied — so the gate would pass in
  # precisely the cases it exists to catch. With it, the job runs regardless and reads the result
  # itself. `needs.build.result` collapses the whole matrix: it is 'success' only when every leg
  # succeeded, so a single red SDK is enough to fail here.
  ci:
    name: CI
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Verify every matrix leg succeeded
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "build: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::the build matrix did not succeed (result: $RESULT)"
            exit 1
          fi
