name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A run that never gets a runner cannot be cancelled or re-run through the API — GitHub answers
  # "cannot cancel a workflow re-run that has not yet queued" and "this workflow is already running".
  # Without a manual trigger the only way out is an empty commit, so there is one.
  workflow_dispatch:

# Supersede a run the moment a newer commit arrives on the same branch or pull request. Three
# pushes in a row otherwise hold six runners to answer a question only the last one asks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (SDK ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    # The whole job runs in about a minute; the cap only bounds a hung one, which would otherwise
    # hold its runner for the six-hour default.
    timeout-minutes: 20
    permissions:
      contents: read

    # The matrix is over SDK versions rather than operating systems, deliberately. This library has
    # no platform-specific code — no paths, no culture-sensitive comparisons — so Windows would add
    # cost and catch nothing. What has actually broken this build, twice, is an analyzer difference
    # between the SDK declared in global.json and the newest one, so that is what is guarded here.
    strategy:
      fail-fast: false
      matrix:
        sdk: ['10.0.100', '10.0.x']

    env:
      CI: true
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts

      # The previous generation of this library shipped for years without its ASP.NET Core
      # framework reference, because the package was assembled by a hand-written .nuspec.
      # This check makes that class of mistake impossible to merge. It is a script rather than
      # inline bash so the release runs the same one — a check written out twice is a check that is
      # eventually only true once, and the companion package is what that cost: it was published
      # verified by nothing while this step read the main package only.
      - name: Verify what is inside both packages
        run: tools/packaging/verify-packages.sh artifacts

      # Everything above reaches the library through a ProjectReference, which never exercises the
      # package: not the framework reference, not the analyzers' place inside it, not the MSBuild
      # assets, and not whether a consumer with their own defaults can compile against any of it.
      # This starts from a fresh pack and ends at an HTTP response. It runs on both SDKs, because an
      # analyzer behaving differently between them is the reason this matrix exists.
      - name: Package smoke test
        timeout-minutes: 10
        run: tests/PackageSmokeTest/run.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-sdk-${{ matrix.sdk }}
          path: artifacts/*

  # No compiler setting and no analyzer can express these — Roslyn's formatting options decide
  # whether a single-line statement survives, never whether it should have been written that way —
  # so it is a script, and it needs no SDK. Kept out of the matrix above because the answer cannot
  # depend on which SDK asked.
  style:
    name: Coding style
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # First that the checker works, then what it says. In the other order a checker that reports
      # nothing because it is broken reads exactly like a clean tree.
      - name: The checker still recognises what it must and must not report
        run: tools/style/lint-layout.test.sh

      - name: Guards, runs of guards, values beside their name, and one-line suppressions
        run: tools/style/lint-layout.sh

  # The repository's own shell tooling, which nothing else exercises. Kept apart from the style job
  # because that one is about what the C# looks like, and separate from `build` because none of this
  # needs an SDK.
  #
  # Five scripts, over a thousand lines, and fourteen inline `run:` blocks, read by nothing until
  # now — in a repository that lints its C# down to the width of a guard. shellcheck ships on the
  # runner image, and actionlint carries its own shellcheck pass over the inline blocks, which is
  # the half no script linter can reach.
  #
  # The changelog extractor earns a test more than most: it runs once, inside the release workflow,
  # at the one moment nothing can be taken back, and every way it can be wrong is silent. A section
  # that comes back empty reads exactly like a release with nothing to report.
  scripts:
    name: Script checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Static before behavioural, because a failing step stops the ones after it and a script
      # shellcheck rejects is one whose test result says less.
      - name: Every tracked shell script
        run: git ls-files '*.sh' | xargs shellcheck

      # Pinned by digest rather than by version, and verified before it runs: this downloads an
      # executable and hands it the repository. The tag is only a comment, the way the actions above
      # carry theirs.
      - name: The workflows, and the shell inside them
        env:
          ACTIONLINT_VERSION: '1.7.7'
          ACTIONLINT_SHA256: '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757'
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o actionlint.tar.gz "$url"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      - name: The changelog extractor returns what it must and refuses what it must
        run: tools/release-notes/changelog-section.test.sh

  # The one check `main` requires, and the only reason this job exists.
  #
  # The matrix above reports under names that carry the SDK it ran on — "build (SDK 10.0.100)" and
  # "build (SDK 10.0.x)". Requiring those by name works exactly until the matrix changes: the
  # required name then belongs to a job nobody runs, so it never reports, and every pull request
  # sits at "Expected — waiting for status" with no way forward but an admin bypass. Requiring this
  # job instead leaves the matrix free to grow an SDK or an operating system without anyone
  # remembering to go and edit a branch rule.
  #
  # `if: always()` is load-bearing. Without it this job is skipped whenever something it needs fails
  # or is cancelled, and GitHub counts a skipped required check as satisfied — so the gate would
  # pass in precisely the cases it exists to catch. With it, the job runs regardless and reads the
  # results itself. `needs.build.result` collapses the whole matrix: it is 'success' only when every
  # leg succeeded, so a single red SDK is enough to fail here.
  #
  # Anything added to `needs` must also be read below. A job listed there and not checked is worse
  # than one that was never added: the pull request grows a check that looks required and gates
  # nothing.
  ci:
    name: CI
    needs: [build, style, scripts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Verify every job this gate covers succeeded
        env:
          BUILD: ${{ needs.build.result }}
          STYLE: ${{ needs.style.result }}
          SCRIPTS: ${{ needs.scripts.result }}
        run: |
          set -euo pipefail
          echo "build: $BUILD"
          echo "style: $STYLE"
          echo "scripts: $SCRIPTS"
          failed=0
          [ "$BUILD" = "success" ] || { echo "::error::the build matrix did not succeed (result: $BUILD)"; failed=1; }
          [ "$STYLE" = "success" ] || { echo "::error::the coding style check did not succeed (result: $STYLE)"; failed=1; }
          [ "$SCRIPTS" = "success" ] || { echo "::error::the script checks did not succeed (result: $SCRIPTS)"; failed=1; }
          exit "$failed"
