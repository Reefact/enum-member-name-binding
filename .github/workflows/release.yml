name: Release

# The Git tag is the single source of truth for the published version.
#
# workflow_dispatch runs everything except the two irreversible steps, so the OIDC login and the
# package checks can be proved before a tag exists. A tag is awkward to take back; a dry run is not.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build during a dry run (nothing is published).'
        required: false
        default: '0.0.0-dryrun'

permissions:
  contents: write
  id-token: write   # required by NuGet trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    env:
      CI: true
      DOTNET_NOLOGO: true
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # A tag is what triggers a publication, and a tag can be pushed anywhere. Nothing else in this
      # pipeline would notice: the branch ruleset governs what lands on main, not where a ref points,
      # so a `v*` tag placed on an unreviewed branch tip would build, pack and publish exactly as a
      # release does. What proves a commit was reviewed is that it is on main, so that is what is
      # checked — before anything is built, and long before anything is irreversible.
      #
      # Skipped on a dry run, deliberately: rehearsing a release from a branch is the point of the
      # dry run, and it publishes nothing.
      - name: Refuse a tag that is not on main
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          # The checkout above resolved a tag, so main is not necessarily present as a ref yet.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "$GITHUB_REF_NAME points at $GITHUB_SHA, which is on main."
          else
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. A release is published from reviewed history only: delete the tag, land the commit through a pull request, then tag again."
            exit 1
          fi

      - name: Derive the version
        id: version
        # The dispatch input arrives through the environment rather than through ${{ }}, so that a
        # value containing shell syntax is data and not script.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          # The trigger is `v*`, which matches far more than a version: `vnext`, `v1`, `v1.0.0.0`,
          # and — because Git allows the character in a ref name — `v1.0.0;whoami`. Until here that
          # string is nothing but an attacker-influenced token, and it is about to become both an
          # MSBuild property and the version under which two packages are published forever. So it is
          # validated against a SemVer 2.0.0 allowlist first, and a name that does not match stops the
          # run before a single project is built.
          #
          # Build metadata (`1.0.0+abc`) is refused rather than accepted: nuget.org drops it from the
          # published version, so a tag carrying it would name one thing and publish another.
          #
          # Matched with bash's own `=~` rather than piped to grep, because grep decides line by line:
          # a value whose FIRST line is a valid version would satisfy it and carry anything after the
          # newline through. A ref name cannot hold a newline, but the dispatch input can, and the two
          # paths meet here. `=~` anchors ^ and $ to the whole string, so it cannot be split that way.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::'$version' is not a SemVer 2.0.0 version. Expected X.Y.Z or X.Y.Z-prerelease, with no build metadata — for example 1.0.0 or 1.0.0-preview.1."
            exit 1
          fi

          # SemVer puts the pre-release identifier after the first hyphen, so 1.0.0-preview.1 has one
          # and 1.0.0 does not. nuget.org reads the version string itself and needs no help, but a
          # GitHub release is flagged by the caller: left alone, a preview would be published as an
          # ordinary release and become the one the repository front page offers.
          case "$version" in
            *-*) prerelease=true  ;;
            *)   prerelease=false ;;
          esac

          {
            echo "value=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (prerelease: $prerelease)"

      # The version reaches the shell through the environment, not through ${{ }} — the same rule the
      # step above states for the dispatch input, which this step used to break. Interpolated, a tag
      # named `v1.0.0;id` would have run `id`. The allowlist already makes that string unreachable;
      # this keeps the guarantee from resting on the allowlist alone.
      - name: Build, test and pack
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          dotnet build -c Release -p:Version="$VERSION"
          dotnet test -c Release --no-build
          dotnet pack -c Release --no-build -o artifacts -p:Version="$VERSION"

      - name: Verify the package declares its ASP.NET Core framework reference and ships the analyzers
        run: |
          set -euo pipefail
          package=$(ls artifacts/AspNetCore.EnumMemberNameBinding.[0-9]*.nupkg)
          unzip -p "$package" 'AspNetCore.EnumMemberNameBinding.nuspec' \
            | grep -q 'frameworkReference name="Microsoft.AspNetCore.App"' \
            || { echo "::error::the package does not declare Microsoft.AspNetCore.App"; exit 1; }
          unzip -l "$package" | grep -q 'analyzers/dotnet/cs/AspNetCore.EnumMemberNameBinding.Analyzers.dll' \
            || { echo "::error::the package does not ship the analyzers"; exit 1; }
          echo "Packages built:"
          ls -1 artifacts

      # The last gate before anything irreversible: build a consumer against the packed library and
      # drive it over HTTP. The step above checks what is inside the package; this one checks that
      # somebody else can actually use it.
      - name: Package smoke test
        timeout-minutes: 10
        run: tests/PackageSmokeTest/run.sh

      # Trusted publishing: short-lived OIDC credentials, no long-lived API key in secrets.
      # Runs on a dry run too — proving the login works is the point of the exercise.
      - name: Authenticate to NuGet
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # The key travels by environment for the same reason the version does. Interpolating a secret
      # into a run block writes it into the generated script, where an unlucky `set -x` or a shell
      # error message can spill what the log masker only knows how to redact after the fact.
      - name: Confirm the credentials were issued
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::trusted publishing returned no API key"; exit 1
          fi
          echo "A short-lived API key was issued."

      - name: Push
        if: env.DRY_RUN != 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json

      # --latest=false is not implied by --prerelease: the two are separate fields, and a repository
      # with no stable release yet would otherwise show a preview as its latest. A stable version
      # passes neither flag, so GitHub keeps deciding by date and version — which is what a backport
      # of an older major needs, since it must not displace the newer one.
      - name: Create the GitHub release
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes --prerelease --latest=false
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}

      # The release step is skipped on a dry run, so the assumption it rests on is checked here
      # instead: that this runner's gh understands the flags a preview needs. Learning otherwise
      # while the tag is already pushed would be learning too late.
      - name: Confirm gh supports the flags the release step uses
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          gh --version
          help=$(gh release create --help 2>&1)
          for flag in --generate-notes --prerelease --latest; do
            printf '%s\n' "$help" | grep -q -- "$flag" \
              || { echo "::error::gh release create does not support $flag on this runner"; exit 1; }
            echo "gh release create supports $flag"
          done

      # The release step itself is skipped here, so the one thing it decides is reported instead —
      # otherwise whether a preview is flagged as one would first be observed on the real release.
      - name: Dry run summary
        if: env.DRY_RUN == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          {
            echo "### Dry run"
            echo
            echo "Everything ran except the NuGet push and the GitHub release."
            echo "Packages were built and verified, and trusted publishing issued a key."
            echo
            echo "Version \`$VERSION\` — prerelease: \`$PRERELEASE\`."
            if [ "$PRERELEASE" = "true" ]; then
              echo "A real run would pass \`--prerelease --latest=false\`, so it would not become the latest release."
            else
              echo "A real run would pass neither flag, so GitHub would decide whether it becomes the latest release."
            fi
            echo
            echo "Tag the commit to publish for real."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: env.DRY_RUN == 'true'
        with:
          name: dry-run-packages
          path: artifacts/*
