name: Release

# The Git tag is the single source of truth for the published version.
#
# workflow_dispatch runs everything except the two irreversible steps, so the OIDC login and the
# package checks can be proved before a tag exists. A tag is awkward to take back; a dry run is not.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build during a dry run (nothing is published).'
        required: false
        default: '0.0.0-dryrun'

# Never cancel a release. The CI workflow supersedes a run the moment a newer commit arrives, which
# is right there and wrong here: the steps after the smoke test push packages and create a release,
# and a run killed between them leaves a version half published — a state no rerun can reach,
# because the tag can neither be moved nor deleted.
#
# Never cancel, and deliberately not "serialise", which an earlier version of this comment claimed.
# The group carries the ref, so a release queues behind reruns of its own tag and behind nothing
# else: two tags are two groups and publish side by side. That reads like an oversight and is not.
# They build different versions, push different packages and create different releases, so they have
# nothing to race over — while a per-ref group is exactly what makes it impossible for one release to
# cancel another, which is the property this block is here for.
#
# Serialising them for real would take `queue: max` as well as a ref-less group, since a group
# replaces its pending run when a newer one arrives — dropping the ref alone would reintroduce the
# cancellation above. That key is valid to GitHub as of 2026-05-07 and unknown to every actionlint
# release, so adopting it today means carrying a suppression for a checker that will learn it on its
# own. Not a trade worth making for a race with no stake. Revisit if a release ever has to serialise
# against something real: a shared deployment environment, or a feed that cannot take two writers.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write        # required by NuGet trusted publishing (OIDC)
  attestations: write    # store the build-provenance attestation for the published packages

jobs:
  publish:
    runs-on: ubuntu-latest
    # No deployment environment, matching the other repositories in this organisation. Two things
    # have to agree with that and are not visible from here: NUGET_USER must be a repository-level
    # variable rather than one scoped to an environment, and the trusted-publishing policy on
    # nuget.org must not require a GitHub environment — the OIDC token stops carrying that claim
    # the moment this line is absent, and a policy demanding it would refuse the exchange.
    env:
      CI: true
      DOTNET_NOLOGO: true
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # A tag is what triggers a publication, and a tag can be pushed anywhere. Nothing else in this
      # pipeline would notice: the branch ruleset governs what lands on main, not where a ref points,
      # so a `v*` tag placed on an unreviewed branch tip would build, pack and publish exactly as a
      # release does. What proves a commit was reviewed is that it is on main, so that is what is
      # checked — before anything is built, and long before anything is irreversible.
      #
      # Skipped on a dry run, deliberately: rehearsing a release from a branch is the point of the
      # dry run, and it publishes nothing.
      - name: Refuse a tag that is not on main
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          # The checkout above resolved a tag, so main is not necessarily present as a ref yet.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "$GITHUB_REF_NAME points at $GITHUB_SHA, which is on main."
          else
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. A release is published from reviewed history only: delete the tag, land the commit through a pull request, then tag again."
            exit 1
          fi

      - name: Derive the version
        id: version
        # The dispatch input arrives through the environment rather than through ${{ }}, so that a
        # value containing shell syntax is data and not script.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          # The trigger is `v*`, which matches far more than a version: `vnext`, `v1`, `v1.0.0.0`,
          # and — because Git allows the character in a ref name — `v1.0.0;whoami`. Until here that
          # string is nothing but an attacker-influenced token, and it is about to become both an
          # MSBuild property and the version under which two packages are published forever. So it is
          # validated against a SemVer 2.0.0 allowlist first, and a name that does not match stops the
          # run before a single project is built.
          #
          # Build metadata (`1.0.0+abc`) is refused rather than accepted: nuget.org drops it from the
          # published version, so a tag carrying it would name one thing and publish another.
          #
          # Matched with bash's own `=~` rather than piped to grep, because grep decides line by line:
          # a value whose FIRST line is a valid version would satisfy it and carry anything after the
          # newline through. A ref name cannot hold a newline, but the dispatch input can, and the two
          # paths meet here. `=~` anchors ^ and $ to the whole string, so it cannot be split that way.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::'$version' is not a SemVer 2.0.0 version. Expected X.Y.Z or X.Y.Z-prerelease, with no build metadata — for example 1.0.0 or 1.0.0-preview.1."
            exit 1
          fi

          # SemVer puts the pre-release identifier after the first hyphen, so 1.0.0-preview.1 has one
          # and 1.0.0 does not. nuget.org reads the version string itself and needs no help, but a
          # GitHub release is flagged by the caller: left alone, a preview would be published as an
          # ordinary release and become the one the repository front page offers.
          case "$version" in
            *-*) prerelease=true  ;;
            *)   prerelease=false ;;
          esac

          {
            echo "value=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (prerelease: $prerelease)"

      # Before anything is built, and long before anything is irreversible: a tag whose changelog
      # entry was never written stops here rather than after the build, the pack and the smoke test.
      #
      # This step replaces `--generate-notes`, which filled the release with the pull-request titles
      # merged since the previous tag. That is a version-control log wearing a different hat, and it
      # is the one shape release notes are explicitly not allowed to take: a reader cannot tell from
      # it whether to upgrade. The summary written for that purpose already exists in CHANGELOG.md,
      # so it is read out instead — by a script anyone can run locally, with its own test, rather
      # than by a line of shell that only ever executes here.
      #
      # A dry run reports where a real run refuses. Its default version is 0.0.0-dryrun, which no
      # changelog will ever carry, so failing would break the rehearsal this trigger exists to
      # provide — while a dry run asked for a real version still says whether that section is ready.
      - name: Resolve the release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if tools/release-notes/changelog-section.sh "$VERSION" > release-notes.md; then
            echo "--- release notes for $VERSION ---"
            cat release-notes.md
          elif [ "$DRY_RUN" = "true" ]; then
            echo "::warning::CHANGELOG.md has no usable entry for $VERSION; a real release of this version would stop here"
          else
            echo "::error::CHANGELOG.md has no usable entry for $VERSION — write it before tagging, moving what applies out of [Unreleased]"
            exit 1
          fi

      # The version reaches the shell through the environment, not through ${{ }} — the same rule the
      # step above states for the dispatch input, which this step used to break. Interpolated, a tag
      # named `v1.0.0;id` would have run `id`. The allowlist already makes that string unreachable;
      # this keeps the guarantee from resting on the allowlist alone.
      - name: Build, test and pack
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          dotnet build -c Release -p:Version="$VERSION"
          dotnet test -c Release --no-build
          dotnet pack -c Release --no-build -o artifacts -p:Version="$VERSION"

      # The same script CI runs, so what is proved on every pull request is what is proved here.
      # It covers both published packages; this step read only the main one until then, which left
      # the companion — its dependency floor and the build/*.targets a consumer cannot do without —
      # verified by nothing on the way to nuget.org.
      - name: Verify what is inside both packages
        run: tools/packaging/verify-packages.sh artifacts

      # The last gate before anything irreversible: build a consumer against the packed library and
      # drive it over HTTP. The step above checks what is inside the package; this one checks that
      # somebody else can actually use it.
      - name: Package smoke test
        timeout-minutes: 10
        run: tests/PackageSmokeTest/run.sh

      # Sign a statement that these exact bytes were built by this workflow, from this commit, and
      # store it where anyone can check it:
      #
      #   gh attestation verify Reefact.AspNetCore.EnumMemberNameBinding.1.0.0.nupkg \
      #     --repo Reefact/enum-member-name-binding
      #
      # Everything above proves the package is correct; this is the only thing that ties it to an
      # origin. Without it, a consumer downloading a .nupkg has the maintainer's word that it came
      # from this repository and nothing else — and nuget.org re-signs packages on receipt, so the
      # signature they see is nuget.org's, not ours.
      #
      # It runs on a dry run too, deliberately. The attestation needs its own permission and its own
      # OIDC exchange, and a failure in either is precisely what a rehearsal is for; discovering it
      # with a tag already pushed would be discovering it too late. The cost is a stored attestation
      # for a package that was never published, which is metadata nobody resolves.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/*.nupkg'

      # Trusted publishing: short-lived OIDC credentials, no long-lived API key in secrets.
      # Runs on a dry run too — proving the login works is the point of the exercise.
      - name: Authenticate to NuGet
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # The key travels by environment for the same reason the version does. Interpolating a secret
      # into a run block writes it into the generated script, where an unlucky `set -x` or a shell
      # error message can spill what the log masker only knows how to redact after the fact.
      - name: Confirm the credentials were issued
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::trusted publishing returned no API key"; exit 1
          fi
          echo "A short-lived API key was issued."

      # Both packages go in one invocation — the glob expands to two arguments and `dotnet nuget push`
      # takes them all, which was measured rather than read off the synopsis. The symbol packages are
      # deliberately not in the glob: `*.nupkg` does not match `.snupkg`, and NuGet pushes the `.snupkg`
      # sitting beside a package along with it. Widening this to `artifacts/*` would try to push them
      # as packages in their own right.
      #
      # --skip-duplicate is the one flag here that is not cosmetic. This step is also the only one a
      # dry run never reaches, so a partial failure is discovered in a real release or not at all: the
      # main package published, the companion lost to a network error, and the workflow red. On the
      # rerun the main package is a duplicate, and without this flag its 409 stops the command before
      # the companion — the very package the rerun exists to send. The flag turns that into a warning
      # and, in the CLI's own words, "continue[s] with the next package in the push".
      - name: Push
        if: env.DRY_RUN != 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push artifacts/*.nupkg \
            --skip-duplicate \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json

      # The question --skip-duplicate makes it impossible for the step above to answer. A 409 is not
      # only "you already sent this": v1.0.0-beta.1 was answered 409 on both packages, printed
      # "already exists at feed", exited 0, and never reached nuget.org. Every step was green and
      # nothing was published, which is the shape of failure this repository keeps meeting — so the
      # release now reads the feed rather than the exit code.
      - name: Verify both packages are really on the feed
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          tools/packaging/verify-published.sh "$VERSION" \
            Reefact.AspNetCore.EnumMemberNameBinding \
            Reefact.AspNetCore.EnumMemberNameBinding.OpenApi
        env:
          VERSION: ${{ steps.version.outputs.value }}

      # --latest=false is not implied by --prerelease: the two are separate fields, and a repository
      # with no stable release yet would otherwise show a preview as its latest. A stable version
      # passes neither flag, so GitHub keeps deciding by date and version — which is what a backport
      # of an older major needs, since it must not displace the newer one.
      - name: Create the GitHub release
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail

          # One tag push produced two runs on 2026-08-12, and the concurrency group queued the second
          # behind the first rather than cancelling it — correctly, since a release must never be
          # killed midway. The second then failed here, because this was the one step that could not
          # be run twice. Nothing was damaged and the run was red, which is the worst of both: it
          # reads as a failed release. Creating the release is the part that cannot repeat; uploading
          # its assets can, and is what a genuine rerun after a partial failure needs.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "The release already exists. Uploading assets and leaving its notes as published."
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" artifacts/* --notes-file release-notes.md --prerelease --latest=false
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}

      # The release step is skipped on a dry run, so the assumption it rests on is checked here
      # instead: that this runner's gh understands the flags a preview needs. Learning otherwise
      # while the tag is already pushed would be learning too late.
      - name: Confirm gh supports the flags the release step uses
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          gh --version
          help=$(gh release create --help 2>&1)
          for flag in --notes-file --prerelease --latest; do
            printf '%s\n' "$help" | grep -q -- "$flag" \
              || { echo "::error::gh release create does not support $flag on this runner"; exit 1; }
            echo "gh release create supports $flag"
          done

      # The release step itself is skipped here, so the one thing it decides is reported instead —
      # otherwise whether a preview is flagged as one would first be observed on the real release.
      - name: Dry run summary
        if: env.DRY_RUN == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          {
            echo "### Dry run"
            echo
            echo "Everything ran except the NuGet push and the GitHub release."
            echo "Packages were built and verified, and trusted publishing issued a key."
            echo
            echo "Version \`$VERSION\` — prerelease: \`$PRERELEASE\`."
            if [ "$PRERELEASE" = "true" ]; then
              echo "A real run would pass \`--prerelease --latest=false\`, so it would not become the latest release."
            else
              echo "A real run would pass neither flag, so GitHub would decide whether it becomes the latest release."
            fi
            echo
            if [ -s release-notes.md ]; then
              echo "The release notes a real run would publish, read out of \`CHANGELOG.md\`:"
              echo
              echo '```markdown'
              cat release-notes.md
              echo '```'
            else
              echo "\`CHANGELOG.md\` carries no usable \`## [$VERSION]\` section, so a real release of"
              echo "this version would stop before building. Expected on the default dry-run version."
            fi
            echo
            echo "Tag the commit to publish for real."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: env.DRY_RUN == 'true'
        with:
          name: dry-run-packages
          path: artifacts/*
